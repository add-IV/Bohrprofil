name: Release

on:
  push:
    tags: ["v*"]
  # Manual run: builds the zip and uploads it as a workflow artifact (no release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with Nuitka
        run: python build.py

      - name: Package
        shell: pwsh
        run: |
          Rename-Item dist/app.dist Bohrprofil
          Compress-Archive -Path dist/Bohrprofil -DestinationPath Bohrprofil-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bohrprofil-windows
          path: Bohrprofil-windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Bohrprofil-windows.zip
          generate_release_notes: true
